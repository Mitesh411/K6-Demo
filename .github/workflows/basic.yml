name: Basic Workflow

# Manual trigger only: run from the Actions tab -> "Basic Workflow" -> "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6_local_test:
    name: k6 local test run with web dashboard report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up k6
        uses: grafana/setup-k6-action@v1.2.2
        with:
          k6-version: '2.3.0'

      # The web dashboard is built into k6, so no custom xk6 build is needed.
      - name: Run k6 test with dashboard export
        env:
          K6_WEB_DASHBOARD: 'true'
          K6_WEB_DASHBOARD_EXPORT: test-report.html
        run: k6 run script.js

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: k6-dashboard-report
          path: test-report.html
          if-no-files-found: warn
