services:
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb-data:/var/lib/influxdb
      - ./influxdb/init-influxdb.sh:/docker-entrypoint-initdb.d/init-influxdb.sh:ro
    networks:
      - perf-net
    healthcheck:
      test: ["CMD", "curl", "-s", "-I", "http://localhost:8086/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/:ro
      - ./grafana/dashboards/:/var/lib/grafana/dashboards/:ro
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - perf-net

  sample-app:
    build:
      context: ./sample-app
      dockerfile: Dockerfile
    container_name: sample-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - perf-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      - JENKINS_OPTS=--httpPort=8080
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./:/workspace:ro
    networks:
      - perf-net

  k6:
    image: grafana/k6:2.3.0
    container_name: k6-runner
    profiles: ["tools"]
    working_dir: /scripts
    volumes:
      - ./:/scripts
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
      - INFLUXDB_HOST=http://influxdb:8086
      - TARGET_HOST=http://sample-app:8080
    networks:
      - perf-net

  # k6 with headless Chromium, for k6/browser-test.js (Core Web Vitals).
  k6-browser:
    image: grafana/k6:2.3.0-with-browser
    container_name: k6-browser-runner
    profiles: ["tools"]
    working_dir: /scripts
    volumes:
      - ./:/scripts
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
      - TARGET_HOST=http://sample-app:8080
      - K6_BROWSER_HEADLESS=true
      - K6_BROWSER_ARGS=no-sandbox
    networks:
      - perf-net

  sitespeed:
    image: sitespeedio/sitespeed.io:34.2.0
    container_name: sitespeed-runner
    profiles: ["tools"]
    volumes:
      - ./sitespeed-result:/sitespeed.io
    networks:
      - perf-net

networks:
  perf-net:
    driver: bridge

volumes:
  influxdb-data:
  grafana-data:
  jenkins-data:
